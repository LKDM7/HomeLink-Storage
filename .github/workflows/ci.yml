name: Build and tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  packages: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GITHUB_ACTOR: ${{ github.actor }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      HOMELINK_PACKAGES_TOKEN: ${{ secrets.HOMELINK_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build, unit tests and release archive
        run: bash gradlew build test verifyReleaseJar -PuseLocalDependencies=false --no-daemon --no-configuration-cache
      - name: Persistence write
        run: bash gradlew runPersistence -PpersistencePass=write -PuseLocalDependencies=false --no-daemon --no-configuration-cache
      - name: Persistence read
        run: bash gradlew runPersistence -PpersistencePass=read -PuseLocalDependencies=false --no-daemon --no-configuration-cache
      - name: Preserve reports and GameTest logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: storage-validation
          path: |
            build/reports/
            build/test-results/
            build/gametest/logs/
            build/persistence/logs/
            build/validation/**/logs/
            build/validation/**/screenshots/
      - name: Preserve release JARs separately
        uses: actions/upload-artifact@v4
        with:
          name: storage-jars
          path: build/libs/*.jar
