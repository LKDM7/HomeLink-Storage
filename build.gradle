plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.147'
    id 'net.darkhax.curseforgegradle' version '1.1.28'
}
version = mod_version
group = mod_group_id
base { archivesName = mod_id }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
repositories {
    maven {
        name = 'HomeCorePackages'
        url = uri('https://maven.pkg.github.com/LKDM7/HomeCore')
        credentials {
            username = providers.gradleProperty('githubUser').orElse(providers.environmentVariable('GITHUB_ACTOR')).getOrElse('')
            password = providers.gradleProperty('githubToken').orElse(providers.environmentVariable('HOMELINK_PACKAGES_TOKEN')).orElse(providers.environmentVariable('GITHUB_TOKEN')).getOrElse('')
        }
        content { includeGroup 'fr.lkdm.homecore' }
    }

    maven {
        name = 'EnergyPackages'
        url = uri('https://maven.pkg.github.com/LKDM7/HomeLink-Energy')
        credentials {
            username = providers.gradleProperty('githubUser').orElse(providers.environmentVariable('GITHUB_ACTOR')).getOrElse('')
            password = providers.gradleProperty('githubToken').orElse(providers.environmentVariable('HOMELINK_PACKAGES_TOKEN')).orElse(providers.environmentVariable('GITHUB_TOKEN')).getOrElse('')
        }
        content { includeGroup 'fr.lkdm.homelink.energy' }
    }

    mavenCentral()

    maven { url = 'https://maven.blamejared.com/'; content { includeGroup 'mezz.jei'; includeGroup 'net.mezzdev.config' } }
    maven { url = 'https://maven.shedaniel.me/'; content { includeGroup 'me.shedaniel'; includeGroup 'me.shedaniel.cloth' } }
    maven { url = 'https://maven.architectury.dev/'; content { includeGroup 'dev.architectury' } }
    maven { url = 'https://maven.fabricmc.net/'; content { includeGroup 'net.fabricmc' } }
}
// JEI and REI are optional client integrations: compiled against their APIs, never embedded or required.
def withJei = providers.gradleProperty('withJei').isPresent()
def withRei = providers.gradleProperty('withRei').isPresent()
dependencies {
    implementation "fr.lkdm.homecore:homecore:${homecore_version}"
    // Required at runtime: Controllers and Deposits only run on HE supplied by HomeLink Energy networks.
    runtimeOnly "fr.lkdm.homelink.energy:homelink_energy:${energy_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    if (withJei) runtimeOnly "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"
    compileOnly "me.shedaniel:RoughlyEnoughItems-api-neoforge:${rei_version}"
    // Information pages use REI's built-in display type, shipped in the full REI artifact.
    compileOnly("me.shedaniel:RoughlyEnoughItems-neoforge:${rei_version}") { transitive = false }
    // REI's focused-stack hook returns an Architectury event result.
    compileOnly("dev.architectury:architectury-neoforge:${architectury_version}") { transitive = false }
    // REI annotates its API with net.fabricmc.api.Environment; only that annotation type is needed to compile.
    compileOnly("net.fabricmc:fabric-loader:0.16.14") { transitive = false }
    if (withRei) runtimeOnly "me.shedaniel:RoughlyEnoughItems-neoforge:${rei_version}"

    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test', Test) {
    useJUnitPlatform()
    // Tests reading project files (translations) resolve them from here.
    systemProperty 'homelink_storage.projectDir', project.projectDir.absolutePath
    testLogging { events 'passed', 'failed', 'skipped' }
}
sourceSets {
    verification {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}
configurations {
    verificationImplementation.extendsFrom implementation
    verificationRuntimeOnly.extendsFrom runtimeOnly
    verificationCompileOnly.extendsFrom compileOnly
}
def withDashboard = providers.gradleProperty('withDashboard').isPresent()
// Optional runtime fixtures only; never part of the release dependencies or JAR.
def pipeInterop = providers.gradleProperty('pipeInterop').isPresent()
if (pipeInterop) {
    dependencies {
        verificationRuntimeOnly files(providers.gradleProperty('pipeFarmJar').getOrElse('../FarmLink/build/libs/homelink_farm-1.5.0.jar'))
        verificationRuntimeOnly files(providers.gradleProperty('pipeQuarryJar').getOrElse('../HomeLinkQuarry/build/libs/homelink_quarry-1.4.0.jar'))
    }
}
if (withDashboard) {
    sourceSets.verification.java.srcDir 'src/dashboardVerification/java'
    dependencies { verificationImplementation 'fr.lkdm.homelink.dashboard:homelink_dashboard:1.6.0' }
}
neoForge {
    version = project.neo_version
    addModdingDependenciesTo sourceSets.verification
    mods {
        "${mod_id}" { sourceSet sourceSets.main }
        storage_validation { sourceSet sourceSets.verification }
    }
    runs {
        client { client(); loadedMods = [mods.homelink_storage] }
        server { server(); programArgument '--nogui'; loadedMods = [mods.homelink_storage] }
        smoke {
            client()
            systemProperty 'storage.smoke', 'true'
            systemProperty 'storage.dashboardSmoke', withDashboard.toString()
            if (withDashboard) sourceSet = sourceSets.verification
            loadedMods = [mods.homelink_storage, mods.storage_validation]
            gameDirectory = file('build/validation/client')
        }
        persistence {
            type = 'gameTestServer'
            if (pipeInterop) sourceSet = sourceSets.verification
            loadedMods = [mods.homelink_storage, mods.storage_validation]
            gameDirectory = file('build/validation/persistence')
            systemProperty 'neoforge.enabledGameTestNamespaces', 'storage_validation'
            systemProperty 'storage.persistencePass', providers.gradleProperty('persistencePass').getOrElse('read')
        }
        configureEach { logLevel = org.slf4j.event.Level.INFO }
    }
}
def persistenceProperties = layout.buildDirectory.file('validation/persistence/server.properties')
tasks.named('runPersistence') {
    doFirst {
        def config = persistenceProperties.get().asFile
        if (!config.exists()) { config.parentFile.mkdirs(); config.setText('', 'UTF-8') }
    }
}
def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    def values = ['minecraft_version_range', 'neo_version_range', 'loader_version_range',
                  'mod_id', 'mod_name', 'mod_license', 'mod_version', 'mod_authors', 'mod_description', 'homecore_version_range', 'jei_version_range', 'rei_version_range', 'energy_version_range']
            .collectEntries { [(it): project.property(it)] }
    inputs.properties values
    expand values
    from 'src/main/templates'
    into layout.buildDirectory.dir('generated/sources/modMetadata')
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 21 }
tasks.withType(Jar).configureEach {
    from('LICENSE') { into 'META-INF' }
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
tasks.named('check') { dependsOn tasks.named('verificationClasses') }
def releaseJar = tasks.named('jar', Jar).flatMap { it.archiveFile }
tasks.register('verifyReleaseJar') {
    dependsOn tasks.named('jar')
    inputs.file releaseJar
    doLast {
        def archive = new java.util.zip.ZipFile(releaseJar.get().asFile)
        try {
            def names = archive.entries().collect { it.name }
            if (names.any { it.startsWith('fr/lkdm/homecore/') || it.startsWith('fr/lkdm/homelink/dashboard/') || it.startsWith('fr/lkdm/homelink/storage/verification/') }) {
                throw new GradleException('Dependency or validation classes must not be embedded in Storage.')
            }
            for (def path : ['fr/lkdm/homelink/storage/HomeLinkStorage.class', 'META-INF/neoforge.mods.toml',
                              'fr/lkdm/homelink/storage/blockentity/DepositBlockEntity.class',
                              'fr/lkdm/homelink/storage/logistics/transit/TransitLedger.class',
                              'fr/lkdm/homelink/storage/logistics/pipe/StoragePipeBlock.class',
                              'assets/homelink_storage/blockstates/storage_pipe.json',
                              'assets/homelink_storage/models/block/storage_pipe_straight.json',
                              'assets/homelink_storage/models/block/storage_pipe_straight_metal.json',
                              'assets/homelink_storage/models/block/storage_pipe_straight_glass.json',
                              'assets/homelink_storage/models/block/storage_pipe_connector.json',
                              'assets/homelink_storage/models/block/storage_pipe_joint.json',
                              'assets/homelink_storage/textures/block/pipe_glass.png',
                              'assets/homelink_storage/textures/block/pipe_graphite.png',
                              'assets/homelink_storage/textures/block/pipe_copper.png',
                              'data/homelink_storage/recipe/storage_pipe.json',
                              'fr/lkdm/homelink/storage/storage/inventory/StorageInsertion.class',
                              'assets/homelink_storage/blockstates/storage_deposit.json',
                              'assets/homelink_storage/blockstates/storage_overflow.json', 'data/homelink_storage/recipe/storage_overflow.json',
                              'fr/lkdm/homelink/storage/blockentity/OverflowBlockEntity.class',
                              'data/homelink_storage/recipe/storage_deposit.json',
                              'assets/homelink_storage/lang/fr_fr.json', 'assets/homelink_storage/lang/en_us.json']) {
                if (!names.contains(path)) throw new GradleException("Missing JAR entry: ${path}")
            }
            def metadata = archive.getInputStream(archive.getEntry('META-INF/neoforge.mods.toml')).withCloseable { it.getText('UTF-8') }
            if (!metadata.contains('modId="homecore"') || metadata.contains('${')) throw new GradleException('Invalid HomeCore dependency metadata.')
        } finally { archive.close() }
    }
}
tasks.named('check') { dependsOn tasks.named('verifyReleaseJar') }
def smokeOptions = layout.buildDirectory.file('validation/client/options.txt')
def smokeLog = layout.buildDirectory.file('validation/client/logs/latest.log')
def smokeLanguage = providers.gradleProperty('smokeLanguage').getOrElse('en_us')
tasks.named('runSmoke') {
    doFirst {
        def options = smokeOptions.get().asFile
        options.parentFile.mkdirs()
        options.setText("onboardAccessibility:false\ntutorialStep:none\npauseOnLostFocus:false\nrenderDistance:2\nsimulationDistance:5\nmaxFps:60\nlang:${smokeLanguage}\n", 'UTF-8')
    }
    doLast {
        def log = smokeLog.get().asFile.getText('UTF-8')
        def markers = ['STORAGE_SMOKE_OK', 'STORAGE_INVENTORY_CHECKS_OK', 'STORAGE_INDEX_CHECKS_OK',
                       'STORAGE_TERMINAL_CHECKS_OK', 'STORAGE_LOCATE_CHECKS_OK', 'STORAGE_HOMECORE_SERVER_CHECKS_OK',
                       'STORAGE_HOMECORE_CLIENT_CHECKS_OK', 'STORAGE_ROBUSTNESS_CHECKS_OK', 'STORAGE_PACKET_CHECKS_OK',
                       'STORAGE_RECIPE_CHECKS_OK', 'STORAGE_COVERAGE_CHECKS_OK', 'STORAGE_MANUAL_CHECKS_OK',
                       'STORAGE_MANAGEMENT_CHECKS_OK', 'STORAGE_CONTROLLER_CHECKS_OK',
                       'STORAGE_DOUBLE_CHEST_CHECKS_OK', 'STORAGE_WITHDRAWAL_CHECKS_OK', 'STORAGE_WITHDRAWAL_CLIENT_OK',
                       'STORAGE_TERMINAL_MOUNT_CHECKS_OK', 'STORAGE_LINK_KEY_CHECKS_OK', 'STORAGE_DEPOSIT_CLIENT_CHECKS_OK',
                       'STORAGE_WITHDRAW_ANY_CHECKS_OK', 'STORAGE_INGREDIENT_PLAN_CHECKS_OK', 'STORAGE_RECIPE_VIEWER_CHECKS_OK', 'STORAGE_TERMINAL_ONLY_CHECKS_OK', 'STORAGE_CONTROLLER_SCREEN_CHECKS_OK', 'STORAGE_COVERAGE_ZONE_CHECKS_OK', 'STORAGE_COVERAGE_TOGGLE_CHECKS_OK',
                       'STORAGE_OVERFLOW_CHECKS_OK', 'STORAGE_PENDING_CLIENT_CHECKS_OK', 'STORAGE_PIPE_CLIENT_CHECKS_OK',
                       'STORAGE_UI_RESPONSIVE_OK view=terminal', 'STORAGE_UI_RESPONSIVE_OK view=controller']
        if (withDashboard) markers += 'STORAGE_DASHBOARD_CHECKS_OK'
        if (withJei) markers += 'STORAGE_RECIPE_VIEWER_CHECKS_OK jei=true'
        if (withRei) markers += 'rei=true'
        if (markers.any { !log.contains(it) } || log.contains('STORAGE_SMOKE_FAILED')) {
            throw new GradleException('In-game verification failed: inspect build/validation/client/logs/latest.log')
        }
    }
}

def homecoreJarName = "homecore-${homecore_version}.jar"
tasks.register('releaseBundle', Sync) {
    group = 'build'
    description = 'Collects the release mod and its required HomeCore dependency, with installation docs.'
    dependsOn tasks.named('build')
    into layout.buildDirectory.dir('release')
    from(releaseJar)
    from(configurations.runtimeClasspath.filter { it.name == homecoreJarName })
    from('README.md', 'LICENSE')
    from('docs') { into 'docs' }
}

// Unit tests run against the Minecraft classpath without starting a game.
neoForge {
    unitTest {
        enable()
        testedMod = mods."${mod_id}"
    }
}

def curseForgeVersion = providers.gradleProperty('mod_version').get()
def curseForgePublishRequested = gradle.startParameter.taskNames.any {
    it == 'publishToCurseForge' || it.endsWith(':publishToCurseForge')
}
def curseForgeToken = curseForgePublishRequested
        ? providers.gradleProperty('curseforge_api_token')
                .orElse(providers.environmentVariable('CURSEFORGE_API_TOKEN')).getOrNull()
        : null
if (curseForgePublishRequested && !curseForgeToken?.trim()) {
    throw new GradleException('Set curseforge_api_token in your user Gradle properties or CURSEFORGE_API_TOKEN in the environment.')
}

tasks.register('publishToCurseForge', net.darkhax.curseforgegradle.TaskPublishCurseForge) {
    group = 'publishing'
    description = 'Builds and uploads the HomeLink Storage release JAR to CurseForge project 1725199.'
    dependsOn tasks.named('check')
    // Publishing is excluded from the configuration cache so the API token is never cached.
    notCompatibleWithConfigurationCache('The CurseForge upload reads its API token only when publishing.')

    apiToken = curseForgeToken
    debugMode = providers.gradleProperty('curseforge_dry_run').map { it.toBoolean() }.getOrElse(false)

    def mainFile = upload(1725199, tasks.named('jar'))
    mainFile.displayName = "HomeLink Storage ${curseForgeVersion}"
    mainFile.changelog = "HomeLink Storage ${curseForgeVersion} for Minecraft ${minecraft_version} and NeoForge ${neo_version}."
    mainFile.changelogType = 'markdown'
    mainFile.releaseType = 'release'
    mainFile.addGameVersion(minecraft_version)
    mainFile.addEnvironment('Client', 'Server')
    mainFile.addModLoader('NeoForge')
    mainFile.addRequirement('homecore')
    mainFile.addRequirement('homelink-energy')
}
